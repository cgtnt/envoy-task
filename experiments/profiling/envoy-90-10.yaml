# Run Envoy on the host; nginx is published on localhost:8080.
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: benchmark_listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10000
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: benchmark_http
          codec_type: AUTO
          route_config:
            name: benchmark_routes
            virtual_hosts:
            - name: origin
              domains: ["*"]
              routes:
              - match:
                  prefix: "/"
                route:
                  cluster: origin
          http_filters:
          - name: envoy.filters.http.lua
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
              default_source_code:
                inline_string: |
                  -- State is separate for each Envoy worker.
                  local request_count = 0
                  local hit_count = 0
                  local cycle = 10 -- One unique miss per cycle; other requests use warm keys.

                  function envoy_on_request(handle)
                    local headers = handle:headers()
                    local path = headers:get(":path")

                    -- Explicit hot-key requests are used to warm the shared cache.
                    if string.match(path, "^/random%?hit_key=%d+$") then
                      return
                    end
                    if path ~= "/random" then
                      return
                    end

                    request_count = (request_count + 1) % cycle
                    if request_count == 0 then
                      headers:replace(":path", "/random?miss_id=" .. headers:get("x-request-id"))
                    else
                      hit_count = (hit_count % 100) + 1
                      headers:replace(":path", "/random?hit_key=" .. hit_count)
                    end
                  end
          - name: envoy.filters.http.simple_cache
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.simple_cache.v3.SimpleCacheConfig
              max_entry_bytes: 1048576 # 1 MiB
              max_cache_bytes: 67108864 # 64 MiB
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: origin
    connect_timeout: 1s
    type: STATIC
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: origin
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8080
